plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.aurammods.paracraft'
version = mod_version
base.archivesName = 'paracraft-forge-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run/development')
            property 'forge.logging.console.level', 'info'
            mods { paracraft { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            def restartPhase = providers.gradleProperty('restartPhase').getOrElse('')
            workingDirectory project.file(restartPhase ? 'run/restart-qa' : 'run/gametest')
            property 'forge.enabledGameTestNamespaces', restartPhase ? 'paracraft_restart' : 'paracraft'
            property 'paracraft.qa.restartPhase', restartPhase
            mods { paracraft { source sourceSets.gameTest } }
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) { finalizedBy 'reobfJar' }
// Every headless suite gets an isolated disposable world. Restart-persistence QA
// uses a separate server workspace; ordinary GameTests must not inherit old drops.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        if (!project.hasProperty('restartPhase')) project.delete(project.layout.projectDirectory.dir('run/gametest/world'))
        // Forge's GameTestMain delegates world creation to the dedicated-server
        // properties. Its default random terrain can contain loot in a test's
        // nine-chunk search at any height, outside the placed arena.
        def qaDirectory = project.file(project.hasProperty('restartPhase') ? 'run/restart-qa' : 'run/gametest')
        qaDirectory.mkdirs()
        new File(qaDirectory, 'server.properties').text = '''level-name=world
level-seed=0
level-type=minecraft:flat
generate-structures=false
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
online-mode=false
spawn-protection=0
enable-command-block=true
view-distance=8
simulation-distance=8
'''
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
